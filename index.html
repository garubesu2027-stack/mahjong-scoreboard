<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀成績表</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1f2430;
    --sub-text: #6b7280;
    --border: #e2e4e9;
    --accent: #2f6fed;
    --accent-soft: #eaf1fe;
    --plus-color: #d93025;
    --minus-color: #1a73e8;
    --fee-color: #188038;
    --header-bg: #232838;
    --header-text: #f4f5f7;
    --total-bg: #fff7e0;
    --rank1: #ffd54f;
    --rank2: #cfd8dc;
    --rank3: #ffab91;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card-bg: #1e2129;
      --text: #e7e9ee;
      --sub-text: #9aa0ab;
      --border: #333846;
      --accent: #5b8dfb;
      --accent-soft: #253252;
      --plus-color: #ff6b6b;
      --minus-color: #6fa8ff;
      --fee-color: #4ade80;
      --header-bg: #10131a;
      --header-text: #e7e9ee;
      --total-bg: #33302066;
      --rank1: #8a6d00;
      --rank2: #4a4f57;
      --rank3: #6b3a26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 20px;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
  }
  .page-toolbar {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  #tablesRoot > .table-card {
    margin-bottom: 24px;
  }
  .table-label {
    font-weight: 700;
    color: var(--accent);
    font-size: 0.95rem;
    margin-bottom: 10px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    overflow-x: auto;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(0.95); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .btn-danger {
    background: transparent;
    color: var(--sub-text);
    padding: 4px 8px;
    font-size: 0.85rem;
  }
  .btn-danger:hover { color: var(--plus-color); }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: center;
    white-space: nowrap;
  }
  thead th {
    background: var(--header-bg);
    color: var(--header-text);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  thead th.name-cell {
    padding: 6px 8px;
  }
  .player-name-input {
    width: 100%;
    min-width: 70px;
    text-align: center;
    background: transparent;
    color: inherit;
    border: none;
    border-bottom: 1px dashed rgba(255,255,255,0.4);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 3px 2px;
  }
  .player-name-input:focus {
    outline: none;
    border-bottom: 1px solid #fff;
  }
  .remove-player-btn {
    display: block;
    margin: 4px auto 0;
    background: transparent;
    color: rgba(255,255,255,0.65);
    font-size: 0.75rem;
    padding: 0 2px;
  }
  .remove-player-btn:hover { color: var(--plus-color); }
  td.round-cell {
    font-weight: 600;
    color: var(--sub-text);
    background: var(--card-bg);
  }
  .round-cell-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .score-input {
    width: 80px;
    text-align: center;
    padding: 6px 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  .score-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .score-plus { color: var(--plus-color); }
  .score-minus { color: var(--minus-color); }
  .score-fee { color: var(--fee-color); }
  tfoot td {
    font-weight: 700;
  }
  tfoot tr.total-row td {
    background: var(--total-bg);
    font-size: 1.02rem;
  }
  tfoot tr.rank-row td {
    background: var(--card-bg);
    font-size: 0.85rem;
    color: var(--sub-text);
  }
  tfoot tr.settlement-row td {
    background: var(--accent-soft);
    font-size: 0.95rem;
  }
  tfoot tr.settlement-final-row td {
    background: var(--total-bg);
    font-size: 1.05rem;
  }
  .settlement-sub {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--sub-text);
    margin-top: 2px;
  }
  .settlement-formula {
    margin-top: 6px;
    font-size: 0.76rem;
    color: var(--sub-text);
    text-align: right;
  }
  .rank-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
    color: #1f2430;
  }
  .rank-1 { background: var(--rank1); }
  .rank-2 { background: var(--rank2); }
  .rank-3 { background: var(--rank3); }
  .rank-other { background: transparent; color: var(--sub-text); }
  .balance-note {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--sub-text);
    text-align: right;
  }
  .balance-note.warn { color: var(--plus-color); }
  .share-panel {
    margin-bottom: 14px;
    padding: 12px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    background: var(--bg);
  }
  .share-status {
    font-size: 0.85rem;
    color: var(--sub-text);
    margin-bottom: 8px;
  }
  .share-status strong {
    color: var(--text);
    font-family: monospace;
    font-size: 0.95rem;
  }
  .share-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .share-input {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.88rem;
    min-width: 100px;
    max-width: 120px;
  }
  .share-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .share-note {
    font-size: 0.74rem;
    color: var(--sub-text);
    margin-top: 8px;
    line-height: 1.5;
  }
  footer.hint {
    max-width: 1000px;
    margin: 14px auto 0;
    font-size: 0.78rem;
    color: var(--sub-text);
    text-align: center;
  }
  @media (max-width: 480px) {
    body { padding: 12px 8px 60px; }
    h1 { font-size: 1.2rem; margin-bottom: 12px; }
    .card { padding: 10px; }
    th, td { padding: 5px 3px; }
    .score-input { width: 54px; padding: 5px 2px; font-size: 0.85rem; }
    .player-name-input { min-width: 48px; font-size: 0.82rem; }
    .remove-player-btn { font-size: 0.68rem; }
    .round-cell-inner { gap: 3px; font-size: 0.82rem; }
    td.round-cell { font-size: 0.82rem; }
    .settlement-sub { font-size: 0.64rem; }
  }
  .password-gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .password-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .password-title { font-size: 1.3rem; margin-bottom: 8px; }
  .password-desc { font-size: 0.85rem; color: var(--sub-text); margin-bottom: 16px; }
  .password-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
    text-align: center;
  }
  .password-input:focus { outline: none; border-color: var(--accent); }
  .password-submit { width: 100%; padding: 10px; font-size: 0.95rem; }
  .password-error { margin-top: 10px; font-size: 0.8rem; color: var(--plus-color); }
  body:not(.authed) .wrap { display: none; }
  body.authed .password-gate { display: none; }
</style>
</head>
<body>
  <div class="password-gate" id="passwordGate">
    <div class="password-box">
      <div class="password-title">🀄 麻雀成績表</div>
      <div class="password-desc">合言葉を入力してください</div>
      <input type="password" class="password-input" id="passwordInput" placeholder="合言葉" autocomplete="off">
      <button class="btn-primary password-submit" id="passwordSubmitBtn">開く</button>
      <div class="password-error" id="passwordError" style="display:none;">合言葉が違います</div>
    </div>
  </div>
  <div class="wrap">
    <h1>🀄 麻雀成績表</h1>
    <div class="page-toolbar">
      <button class="btn-primary" id="addTableBtn">＋ 卓を追加</button>
    </div>
    <div id="tablesRoot"></div>
    <footer class="hint">入力内容はこのブラウザに自動保存されます。プレイヤー名・半荘は自由に追加/削除できます。</footer>
  </div>

  <template id="tableTemplate">
    <div class="card table-card">
      <div class="table-label"></div>
      <div class="toolbar">
        <button class="btn-primary" data-role="addPlayerBtn">＋ プレイヤー追加</button>
        <button class="btn-secondary" data-role="addRoundBtn">＋ 半荘追加</button>
        <button class="btn-secondary" data-role="settlementBtn">精算</button>
        <button class="btn-secondary" data-role="rateModeBtn">料率: テン5</button>
        <button class="btn-secondary" data-role="shareToggleBtn">共有</button>
        <button class="btn-danger" data-role="resetBtn" style="margin-left:auto;">全データをクリア</button>
        <button class="btn-danger" data-role="deleteTableBtn">卓を削除</button>
      </div>
      <div class="share-panel" data-role="sharePanel" style="display:none;">
        <div class="share-status" data-role="shareStatus">共有していません（このブラウザだけのデータです）</div>
        <div class="share-actions" data-role="shareActionsJoin">
          <input type="text" class="share-input" data-role="roomIdInput" placeholder="共有ID" value="888">
          <button class="btn-primary" data-role="shareStartBtn">共有を開始/参加</button>
        </div>
        <div class="share-actions" data-role="shareActionsLeave" style="display:none;">
          <button class="btn-secondary" data-role="copyRoomBtn">共有IDをコピー</button>
          <button class="btn-danger" data-role="leaveRoomBtn">共有を解除</button>
        </div>
        <div class="share-note">同じ共有IDを入力した端末同士で、数秒おきにスコアが自動同期されます。このファイル自体を他の参加者に送って、それぞれの端末で開いてもらってください。</div>
      </div>
      <table>
        <thead>
          <tr data-role="headerRow"></tr>
        </thead>
        <tbody data-role="bodyRows"></tbody>
        <tfoot>
          <tr class="total-row" data-role="totalRow"></tr>
          <tr class="rank-row" data-role="rankRow"></tr>
          <tr class="settlement-row" data-role="settlementTotalRow" style="display:none;"></tr>
          <tr class="settlement-row" data-role="settlementFeeRow" style="display:none;"></tr>
          <tr class="settlement-row settlement-final-row" data-role="settlementFinalRow" style="display:none;"></tr>
        </tfoot>
      </table>
      <div class="balance-note" data-role="balanceNote"></div>
      <div class="settlement-formula" data-role="settlementFormula" style="display:none;"></div>
    </div>
  </template>

<script>
(function () {
  var PASSWORD = "888";
  var AUTH_KEY = "mahjong-scoreboard-authed-v1";

  function tryUnlock() {
    var input = document.getElementById("passwordInput");
    var error = document.getElementById("passwordError");
    if (input.value === PASSWORD) {
      localStorage.setItem(AUTH_KEY, "1");
      document.body.classList.add("authed");
      error.style.display = "none";
    } else {
      error.style.display = "";
      input.value = "";
      input.focus();
    }
  }

  if (localStorage.getItem(AUTH_KEY) === "1") {
    document.body.classList.add("authed");
  } else {
    document.getElementById("passwordSubmitBtn").addEventListener("click", tryUnlock);
    document.getElementById("passwordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryUnlock();
    });
  }
})();

(function () {
  const KVDB_BUCKET = "FEox6V3JXEUPf36t34YEc";
  const KVDB_BASE = "https://kvdb.io/" + KVDB_BUCKET;
  const SYNC_INTERVAL_MS = 3000;
  const TABLES_KEY = "mahjong-scoreboard-tables-v1";

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      });
    }
    (children || []).forEach(c => node.appendChild(c));
    return node;
  }

  function createTable(tableId, label) {
    const templateEl = document.getElementById("tableTemplate");
    const root = templateEl.content.firstElementChild.cloneNode(true);
    document.getElementById("tablesRoot").appendChild(root);
    root.querySelector(".table-label").textContent = "卓 " + label;

    function q(role) {
      return root.querySelector('[data-role="' + role + '"]');
    }

    const STORAGE_KEY = tableId === "default" ? "mahjong-scoreboard-data-v1" : "mahjong-scoreboard-data-v1-" + tableId;
    const ROOM_STORAGE_KEY = tableId === "default" ? "mahjong-scoreboard-room-v1" : "mahjong-scoreboard-room-v1-" + tableId;

    let state = loadState();
    let roomId = localStorage.getItem(ROOM_STORAGE_KEY) || null;
    let lastSyncedAt = 0;
    let pushDebounceTimer = null;
    let pollIntervalId = null;
    let settlementVisible = false;
    let settlementMode = "ten5"; // "ten5" or "tenpin"

    function defaultState() {
      return {
        players: [
          { id: uid(), name: "プレイヤー1" },
          { id: uid(), name: "プレイヤー2" },
          { id: uid(), name: "プレイヤー3" },
          { id: uid(), name: "プレイヤー4" }
        ],
        rounds: [
          { id: uid(), scores: {} }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        if (!parsed.players || !parsed.rounds) return defaultState();
        return parsed;
      } catch (e) {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // 共有IDへの反映(入力の度に呼ぶが、実際の通信は少し待って1回にまとめる)
    function schedulePush() {
      saveState();
      if (!roomId) return;
      clearTimeout(pushDebounceTimer);
      pushDebounceTimer = setTimeout(pushState, 500);
    }

    function pushState() {
      if (!roomId) return;
      const updatedAt = Date.now();
      const payload = JSON.stringify({ players: state.players, rounds: state.rounds, updatedAt });
      lastSyncedAt = updatedAt;
      fetch(KVDB_BASE + "/" + encodeURIComponent(roomId), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payload
      }).catch(() => {});
    }

    function pollRemote() {
      if (!roomId) return;
      fetch(KVDB_BASE + "/" + encodeURIComponent(roomId))
        .then(res => (res.ok ? res.json() : null))
        .then(data => {
          if (!data || !data.updatedAt || data.updatedAt <= lastSyncedAt) return;
          lastSyncedAt = data.updatedAt;
          state.players = data.players || state.players;
          state.rounds = data.rounds || state.rounds;
          saveState();
          render();
        })
        .catch(() => {});
    }

    function startSync() {
      stopSync();
      pollRemote();
      pollIntervalId = setInterval(pollRemote, SYNC_INTERVAL_MS);
    }

    function stopSync() {
      if (pollIntervalId) clearInterval(pollIntervalId);
      pollIntervalId = null;
    }

    function shareStart(id) {
      id = (id || "").trim() || "888";
      const btn = q("shareStartBtn");
      btn.disabled = true;
      btn.textContent = "接続中...";
      fetch(KVDB_BASE + "/" + encodeURIComponent(id))
        .then(res => (res.ok ? res.json() : null))
        .catch(() => null)
        .then(data => {
          roomId = id;
          localStorage.setItem(ROOM_STORAGE_KEY, roomId);
          if (data && data.players && data.rounds) {
            if (confirm("共有ID「" + id + "」の既存データが見つかりました。この端末のデータを置き換えて同期しますか？\n(キャンセルすると、この端末のデータでこのIDを上書きします)")) {
              state.players = data.players;
              state.rounds = data.rounds;
              lastSyncedAt = data.updatedAt || Date.now();
              saveState();
              render();
            } else {
              lastSyncedAt = 0;
              pushState();
            }
          } else {
            lastSyncedAt = 0;
            pushState();
          }
          startSync();
          renderShareStatus();
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = "共有を開始/参加";
        });
    }

    function leaveRoom() {
      stopSync();
      roomId = null;
      localStorage.removeItem(ROOM_STORAGE_KEY);
      renderShareStatus();
    }

    function renderShareStatus() {
      const statusEl = q("shareStatus");
      const joinActions = q("shareActionsJoin");
      const leaveActions = q("shareActionsLeave");
      if (roomId) {
        statusEl.innerHTML = "";
        statusEl.appendChild(document.createTextNode("共有中 共有ID: "));
        const strong = document.createElement("strong");
        strong.textContent = roomId;
        statusEl.appendChild(strong);
        joinActions.style.display = "none";
        leaveActions.style.display = "";
      } else {
        statusEl.textContent = "共有していません（このブラウザだけのデータです）";
        joinActions.style.display = "";
        leaveActions.style.display = "none";
      }
    }

    function addPlayer() {
      const n = state.players.length + 1;
      state.players.push({ id: uid(), name: "プレイヤー" + n });
      schedulePush();
      render();
    }

    function removePlayer(playerId) {
      if (state.players.length <= 1) {
        alert("プレイヤーは最低1人必要です。");
        return;
      }
      state.players = state.players.filter(p => p.id !== playerId);
      state.rounds.forEach(r => { delete r.scores[playerId]; });
      schedulePush();
      render();
    }

    function renamePlayer(playerId, name) {
      const p = state.players.find(p => p.id === playerId);
      if (p) {
        p.name = name;
        schedulePush();
        renderTotalsOnly();
      }
    }

    function addRound() {
      state.rounds.push({ id: uid(), scores: {} });
      schedulePush();
      render();
    }

    function removeRound(roundId) {
      if (state.rounds.length <= 1) {
        alert("半荘は最低1行必要です。");
        return;
      }
      state.rounds = state.rounds.filter(r => r.id !== roundId);
      schedulePush();
      render();
    }

    function setScore(roundId, playerId, value) {
      const round = state.rounds.find(r => r.id === roundId);
      if (!round) return;
      if (value === "" || value === "-") {
        delete round.scores[playerId];
      } else {
        const num = Number(value);
        if (!Number.isNaN(num)) {
          round.scores[playerId] = num;
        }
      }
      schedulePush();
      renderTotalsOnly();
    }

    function getTotals() {
      const totals = {};
      state.players.forEach(p => { totals[p.id] = 0; });
      state.rounds.forEach(r => {
        state.players.forEach(p => {
          totals[p.id] += (r.scores[p.id] || 0);
        });
      });
      return totals;
    }

    function getRanks(totals) {
      const sorted = [...state.players].sort((a, b) => totals[b.id] - totals[a.id]);
      const ranks = {};
      sorted.forEach((p, idx) => { ranks[p.id] = idx + 1; });
      return ranks;
    }

    function getRoundRankCounts() {
      const firstCount = {};
      const restCount = {};
      state.players.forEach(p => { firstCount[p.id] = 0; restCount[p.id] = 0; });
      state.rounds.forEach(round => {
        // その半荘でスコアが入力されている(=参加している)プレイヤーだけを対象にする
        const entries = state.players
          .filter(p => round.scores[p.id] !== undefined)
          .map(p => ({ id: p.id, score: round.scores[p.id] }));
        if (entries.length < 2) return;
        const sorted = [...entries].sort((a, b) => b.score - a.score);
        let rank = 1;
        sorted.forEach((entry, idx) => {
          if (idx > 0 && entry.score !== sorted[idx - 1].score) {
            rank = idx + 1;
          }
          if (rank === 1) firstCount[entry.id]++;
          else restCount[entry.id]++;
        });
      });
      return { firstCount, restCount };
    }

    function calcSettlement(totals) {
      const { firstCount, restCount } = getRoundRankCounts();
      const settlement = {};
      state.players.forEach(p => {
        const pointsTotal = settlementMode === "tenpin"
          ? totals[p.id] * 100
          : (totals[p.id] / 2) * 100;
        const fee = -(firstCount[p.id] * 200 + restCount[p.id] * 100);
        settlement[p.id] = { pointsTotal, fee, final: pointsTotal + fee };
      });
      return { settlement, firstCount, restCount };
    }

    function formatYen(n) {
      return Math.round(n).toLocaleString() + "円";
    }

    function render() {
      renderHeader();
      renderBody();
      renderTotalsOnly();
    }

    function renderHeader() {
      const headerRow = q("headerRow");
      headerRow.innerHTML = "";
      headerRow.appendChild(el("th", { text: "半荘" }));
      state.players.forEach(p => {
        const th = el("th", { class: "name-cell" });
        let emptyDeleteTimer = null;
        const input = el("input", {
          class: "player-name-input",
          value: p.name,
          oninput: (e) => {
            renamePlayer(p.id, e.target.value);
            clearTimeout(emptyDeleteTimer);
            // スマホの入力欄クリアボタンなどで名前が空になったら、少し待って自動的にプレイヤーを削除する
            // (入力し直している途中で一瞬空になるケースを誤爆させないための猶予)
            if (e.target.value.trim() === "") {
              emptyDeleteTimer = setTimeout(() => removePlayer(p.id), 500);
            }
          }
        });
        input.value = p.name;
        const delBtn = el("button", {
          class: "remove-player-btn",
          text: "✕ 削除",
          onclick: () => removePlayer(p.id)
        });
        th.appendChild(input);
        th.appendChild(delBtn);
        headerRow.appendChild(th);
      });
    }

    function renderBody() {
      const body = q("bodyRows");
      body.innerHTML = "";
      state.rounds.forEach((round, idx) => {
        const tr = el("tr");
        const roundTd = el("td", { class: "round-cell" });
        const inner = el("div", { class: "round-cell-inner" });
        inner.appendChild(document.createTextNode((idx + 1) + "回戦"));
        const delBtn = el("button", {
          class: "btn-danger",
          text: "✕",
          onclick: () => removeRound(round.id)
        });
        inner.appendChild(delBtn);
        roundTd.appendChild(inner);
        tr.appendChild(roundTd);

        state.players.forEach(p => {
          const td = el("td");
          const input = el("input", {
            type: "number",
            class: "score-input",
            placeholder: "0",
            oninput: (e) => {
              setScore(round.id, p.id, e.target.value);
              applyScoreColor(input);
            }
          });
          if (round.scores[p.id] !== undefined) input.value = round.scores[p.id];
          applyScoreColor(input);
          td.appendChild(input);
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    function applyScoreColor(input) {
      input.classList.remove("score-plus", "score-minus");
      const v = Number(input.value);
      if (input.value !== "" && !Number.isNaN(v)) {
        if (v > 0) input.classList.add("score-plus");
        else if (v < 0) input.classList.add("score-minus");
      }
    }

    function renderTotalsOnly() {
      const totals = getTotals();
      const ranks = getRanks(totals);

      const totalRow = q("totalRow");
      totalRow.innerHTML = "";
      totalRow.appendChild(el("td", { text: "合計" }));
      state.players.forEach(p => {
        const t = totals[p.id];
        const td = el("td", { text: (t > 0 ? "+" : "") + t.toLocaleString() });
        if (t > 0) td.classList.add("score-plus");
        else if (t < 0) td.classList.add("score-minus");
        totalRow.appendChild(td);
      });

      const rankRow = q("rankRow");
      rankRow.innerHTML = "";
      rankRow.appendChild(el("td", { text: "順位" }));
      state.players.forEach(p => {
        const rank = ranks[p.id];
        const td = el("td");
        const badge = el("span", {
          class: "rank-badge " + (rank === 1 ? "rank-1" : rank === 2 ? "rank-2" : rank === 3 ? "rank-3" : "rank-other"),
          text: rank + "位"
        });
        td.appendChild(badge);
        rankRow.appendChild(td);
      });

      const settlementTotalRow = q("settlementTotalRow");
      const settlementFeeRow = q("settlementFeeRow");
      const settlementFinalRow = q("settlementFinalRow");
      const settlementFormula = q("settlementFormula");
      settlementTotalRow.innerHTML = "";
      settlementFeeRow.innerHTML = "";
      settlementFinalRow.innerHTML = "";
      if (settlementVisible) {
        const { settlement, firstCount, restCount } = calcSettlement(totals);

        settlementTotalRow.appendChild(el("td", { text: "総合トータル" }));
        state.players.forEach(p => {
          const v = settlement[p.id].pointsTotal;
          const td = el("td", { text: (v > 0 ? "+" : "") + formatYen(v) });
          if (v > 0) td.classList.add("score-plus");
          else if (v < 0) td.classList.add("score-minus");
          settlementTotalRow.appendChild(td);
        });

        settlementFeeRow.appendChild(el("td", { text: "場代" }));
        state.players.forEach(p => {
          const v = settlement[p.id].fee;
          const td = el("td");
          const main = el("div", { text: (v > 0 ? "+" : "") + formatYen(v), class: "score-fee" });
          const sub = el("div", {
            class: "settlement-sub",
            text: "1位" + firstCount[p.id] + "回 / 2位以下" + restCount[p.id] + "回"
          });
          td.appendChild(main);
          td.appendChild(sub);
          settlementFeeRow.appendChild(td);
        });

        settlementFinalRow.appendChild(el("td", { text: "最終結果" }));
        state.players.forEach(p => {
          const v = settlement[p.id].final;
          const td = el("td", { text: (v > 0 ? "+" : "") + formatYen(v) });
          if (v > 0) td.classList.add("score-plus");
          else if (v < 0) td.classList.add("score-minus");
          settlementFinalRow.appendChild(td);
        });

        const totalFormulaText = settlementMode === "tenpin"
          ? "総合トータル = 持ち点合計 × 100円"
          : "総合トータル = 持ち点合計 ÷ 2 × 100円";
        settlementFormula.textContent = totalFormulaText + " ／ 場代 = −（1位の回数 × 200円）−（2位以下の回数 × 100円）／ 最終結果 = 総合トータル ＋ 場代";

        settlementTotalRow.style.display = "";
        settlementFeeRow.style.display = "";
        settlementFinalRow.style.display = "";
        settlementFormula.style.display = "";
      } else {
        settlementTotalRow.style.display = "none";
        settlementFeeRow.style.display = "none";
        settlementFinalRow.style.display = "none";
        settlementFormula.style.display = "none";
      }

      const sum = Object.values(totals).reduce((a, b) => a + b, 0);
      const note = q("balanceNote");
      if (sum === 0) {
        note.textContent = "合計収支: 0（バランス OK）";
        note.classList.remove("warn");
      } else {
        note.textContent = "合計収支: " + (sum > 0 ? "+" : "") + sum.toLocaleString() + "（通常は 0 になります。入力を確認してください）";
        note.classList.add("warn");
      }
    }

    q("addPlayerBtn").addEventListener("click", addPlayer);
    q("addRoundBtn").addEventListener("click", addRound);
    q("settlementBtn").addEventListener("click", (e) => {
      settlementVisible = !settlementVisible;
      e.target.textContent = settlementVisible ? "精算を隠す" : "精算";
      renderTotalsOnly();
    });
    q("rateModeBtn").addEventListener("click", (e) => {
      settlementMode = settlementMode === "ten5" ? "tenpin" : "ten5";
      e.target.textContent = "料率: " + (settlementMode === "ten5" ? "テン5" : "テンピン");
      renderTotalsOnly();
    });
    q("resetBtn").addEventListener("click", () => {
      if (confirm("すべてのプレイヤーとスコアを削除して初期状態に戻します。よろしいですか？")) {
        state = defaultState();
        schedulePush();
        render();
      }
    });
    q("deleteTableBtn").addEventListener("click", () => {
      if (tableIds.length <= 1) {
        alert("卓は最低1つ必要です。");
        return;
      }
      if (!confirm("この卓を削除しますか？この卓のデータは完全に削除されます。")) return;
      stopSync();
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(ROOM_STORAGE_KEY);
      const idx = tableIds.indexOf(tableId);
      if (idx !== -1) tableIds.splice(idx, 1);
      saveTableIds(tableIds);
      root.remove();
      relabelTables();
    });

    q("shareToggleBtn").addEventListener("click", () => {
      const panel = q("sharePanel");
      panel.style.display = panel.style.display === "none" ? "" : "none";
    });
    q("shareStartBtn").addEventListener("click", () => {
      shareStart(q("roomIdInput").value);
    });
    q("leaveRoomBtn").addEventListener("click", () => {
      if (confirm("共有を解除しますか？以降はこの端末だけのデータになります。")) leaveRoom();
    });
    q("copyRoomBtn").addEventListener("click", (e) => {
      if (!roomId) return;
      const finish = (ok) => {
        const original = "共有IDをコピー";
        e.target.textContent = ok ? "コピーしました！" : "コピーに失敗しました";
        setTimeout(() => { e.target.textContent = original; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(roomId).then(() => finish(true)).catch(() => finish(false));
      } else {
        finish(false);
      }
    });

    renderShareStatus();
    if (roomId) startSync();
    render();
  }

  function loadTableIds() {
    try {
      const raw = localStorage.getItem(TABLES_KEY);
      if (!raw) return ["default"];
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed;
      return ["default"];
    } catch (e) {
      return ["default"];
    }
  }

  function saveTableIds(ids) {
    localStorage.setItem(TABLES_KEY, JSON.stringify(ids));
  }

  function relabelTables() {
    const tablesRoot = document.getElementById("tablesRoot");
    Array.from(tablesRoot.children).forEach((child, idx) => {
      const labelEl = child.querySelector(".table-label");
      if (labelEl) labelEl.textContent = "卓 " + (idx + 1);
    });
  }

  const tableIds = loadTableIds();
  tableIds.forEach((id, idx) => createTable(id, String(idx + 1)));

  document.getElementById("addTableBtn").addEventListener("click", () => {
    const newId = "table-" + uid();
    tableIds.push(newId);
    saveTableIds(tableIds);
    createTable(newId, String(tableIds.length));
  });
})();
</script>
</body>
</html>
